<!DOCTYPE html>
<html>
<head>
    <title>GITAM Website</title>

    <style>
        body {
            margin: 0;
            font-family: 'Times New Roman', Times, serif;
        }

        /* MAIN LAYOUT */
        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ROW 1 */
        .top {
            height: 20%;
            display: flex;
        }

        .logo {
            width: 25%;
            background-color: #f0f0f0;
            text-align: center;
        }

        .header {
            width: 75%;
            background-color: #eb0c0c;
            color: white;
            text-align: center;
            line-height: 120px;
            font-size: 28px;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }

        /* ROW 2 */
        .nav {
            height: 15%;
            background-color: #0f33e6;
            text-align: center;
            line-height: 60px;
        }

        .nav a {
            color: white;
            text-decoration: none;
            padding: 12px 15px;
            display: inline-block;
        }

        .nav a:hover {
            background-color: #555;
        }

        /* ROW 3 */
        .bottom {
            height: 65%;
            display: flex;
        }

        .sidebar {
            width: 25%;
            background-color: #e3e70c;
            padding: 10px;
        }

        .sidebar h3 {
            text-align: center;
        }

        .sidebar a {
            display: block;
            padding: 8px;
            text-decoration: none;
            color: #003366;
        }

        .sidebar a:hover {
            background-color: #ddd;
        }

        .content {
            width: 75%;
            background-color: rgb(95, 235, 8);
            padding: 20px;
        }
    </style>

    <script>
        function loadContent(title, text) {
            document.getElementById("content-area").innerHTML =
                "<h2>" + title + "</h2><p>" + text + "</p>";
        }
    </script>
</head>
